name: aes
services:
  server:
    build:
      context: ./app/server
      target: server-dev
    container_name: aes-server
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app/server:/app

  web:
    build:
      context: ./app/web
      target: dev
    container_name: aes-web
    ports:
      - "5173:5173"
    volumes:
      - ./app/web:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started

  db:
    image: postgres:17-alpine
    container_name: aes-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
